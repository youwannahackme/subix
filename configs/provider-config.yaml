    quake: false           # Requires API key
    c99: false             # Requires API key
    fullhunt: false        # Requires API key
    racent: false          # Requires API key
    chinaz_api: false      # Requires API key
    circl: false           # Requires API key + username
    cloudflare: false      # Requires API token
    dnsdb: false           # Requires API key
    github: false          # Requires API token
    ipv4info: false        # Requires API key
    passivedns: false      # Requires API key
    spyse: false           # Requires API token
    windvane: false        # Optional/Requires API key

